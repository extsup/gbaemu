name: Build JNI Bridge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK r21e
        run: |
          sdkmanager "ndk;21.4.7075529"

      - name: Build JNI
        run: |
          export NDK=$ANDROID_SDK_ROOT/ndk/21.4.7075529
          $NDK/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk

      - name: Check output
        run: |
          echo "=== libs ==="
          find libs -type f 2>/dev/null || true
          echo "=== obj ==="
          find obj -name "*.so" -type f 2>/dev/null || true

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: gpsp-jni-so
          path: |
            libs/**/*.so
            obj/local/**/*.so