name: Build JNI Bridge

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Build JNI
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "NDK at: $ANDROID_NDK_HOME"
          chmod +x "$ANDROID_NDK_HOME/ndk-build"
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk

      - name: Check output
        run: |
          echo "=== libs ==="
          find libs -type f 2>/dev/null || true
          echo "=== obj ==="
          find obj -name "*.so" -type f 2>/dev/null || true

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: gpsp-jni-so
          path: |
            libs/**/*.so
