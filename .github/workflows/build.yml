name: Build GBAemu APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK & Build Tools
      run: |
        sdkmanager "ndk;21.4.7075529" "build-tools;30.0.3" "platforms;android-33"

    - name: Build Native Library (NDK)
      run: |
        export NDK=$ANDROID_SDK_ROOT/ndk/21.4.7075529
        cd jni
        $NDK/ndk-build \
          NDK_PROJECT_PATH=.. \
          APP_BUILD_SCRIPT=Android.mk \
          NDK_APPLICATION_MK=Application.mk
        cd ..

    - name: Copy prebuilt gpsp_libretro.so
      run: |
        mkdir -p prebuilt/armeabi-v7a
        cp prebuilt/gpsp_libretro.so prebuilt/armeabi-v7a/gpsp_libretro.so || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5' 

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Sign APK
      run: |
        keytool -genkey -v \
          -keystore gbaemu.jks \
          -keyalg RSA -keysize 2048 \
          -validity 10000 \
          -alias gbaemu \
          -dname "CN=GBAemu" \
          -storepass android \
          -keypass android
        $ANDROID_SDK_ROOT/build-tools/30.0.3/apksigner sign \
          --ks gbaemu.jks \
          --ks-pass pass:android \
          --key-pass pass:android \
          --out GBAemu.apk \
          app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GBAemu
        path: GBAemu.apk
